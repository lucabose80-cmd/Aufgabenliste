name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'capacitor.config.json'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle & sync Capacitor Android
        run: |
          npm run build
          npx cap sync android

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Copy APK to friendly name
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Aufgabenliste.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aufgabenliste-APK
          path: Aufgabenliste.apk
          retention-days: 30

      - name: Publish GitHub Release (android-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Aufgabenliste Android APK (Latest)
          body: |
            Installierbare Android-APK mit:
            - **Lese-Timer Homescreen-Widget** (Buch wechseln, Start/Pause, Beenden & Speichern)
            - **Lockscreen & Statusleisten Live-Timer** (ohne Musik zu unterbrechen)
            - **Kompaktes Aufgaben-Widget** (offene Aufgaben auf einen Blick)
            - **100 % Offline-Start + automatische OTA-Updates** über Vercel
          files: Aufgabenliste.apk
          prerelease: false
          make_latest: true
